<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 · 页面走丢了 | 钟嘉伟</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236366f1'/%3E%3Ctext x='16' y='22' font-size='16' font-family='monospace' fill='%23fff' text-anchor='middle'%3EZW%3C/text%3E%3C/svg%3E" />
<style>
  :root { --bg:#0b1120; --panel:#131c31; --line:#243149; --text:#e8eefc; --muted:#8fa1c0; --brand:#6366f1; --brand2:#22d3ee; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body { min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
    font-family: "Inter","Noto Sans SC",-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; padding:24px; }
  .box { max-width:560px; text-align:center; }
  .kicker { font-family: ui-monospace,"JetBrains Mono",Consolas,monospace; font-size:12px; letter-spacing:.22em;
    text-transform:uppercase; color:var(--brand2); margin:0 0 16px; }
  h1 { font-size: clamp(1.9rem,5vw,2.75rem); line-height:1.2; margin:0 0 14px; letter-spacing:-.02em; }
  p { color:var(--muted); margin:0 0 30px; line-height:1.75; font-size:.95rem; }
  .cta { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  a.btn { display:inline-flex; align-items:center; gap:8px; padding:11px 22px; border-radius:10px; font-size:.9rem;
    font-weight:600; text-decoration:none; transition:transform .18s ease, background .18s ease; }
  a.primary { background:linear-gradient(135deg,var(--brand),#4f46e5); color:#fff; }
  a.ghost { border:1px solid var(--line); color:var(--text); background:var(--panel); }
  a:hover { transform:translateY(-2px); }
  a.ghost:hover { border-color:var(--brand); }
</style>
</head>
<body>
<main class="box">
  <p class="kicker">HTTP 404</p>
  <h1>这个页面，测试也没找到</h1>
  <p>链接可能已经改了，或者这条用例从来没被执行过。</p>
  <div class="cta">
    <a class="btn primary" id="to-home" href="./index.html">回到首页</a>
    <a class="btn ghost" id="to-blog" href="./blog.html">看看文章</a>
  </div>
</main>
<script>
/* GitHub Pages 会把任意深度的 404 都交给本页，相对路径会随请求路径漂移。
   这里向上探测第一个真实存在的 index.html，把站点根算出来再修正链接。 */
(function () {
  var segs = location.pathname.split("/").filter(Boolean);
  var prefix = "";
  var tried = 0;
  function fix(root) {
    var home = document.getElementById("to-home");
    var blog = document.getElementById("to-blog");
    if (home) home.href = root + "index.html";
    if (blog) blog.href = root + "blog.html";
  }
  (function probe(i) {
    if (i > segs.length) { fix("/"); return; }
    prefix = "/" + segs.slice(0, i).join("/") + "/";
    if (i === 0) prefix = "/";
    fetch(prefix + "index.html", { method: "HEAD" })
      .then(function (r) { if (r.ok) { fix(prefix); } else { probe(i + 1); } })
      .catch(function () { probe(i + 1); });
  })(0);
})();
</script>
</body>
</html>
